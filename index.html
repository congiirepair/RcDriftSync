<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64-v3.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167-v3.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152-v3.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="RC Drift Sync is a mobile-first PWA for RC drift setup sheets, tune storage, sharing, cloning, and public tune discovery." />
    <meta property="og:site_name" content="RC Drift Sync" />
    <meta property="og:title" content="RC Drift Sync" />
    <meta property="og:description" content="Mobile-first RC drift tune storage, setup sheets, sharing, and cloning." />
    <meta property="og:url" content="https://rcdriftsync.com/" />
    <meta property="og:image" content="https://rcdriftsync.com/icons/rcds-icon-512-v3.png" />
    <meta name="apple-mobile-web-app-title" content="RC Drift Sync" />
    <title>RC Drift Sync</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;padding:18px;background:#02060c;color:#f8fbff;font-family:Arial,sans-serif;">
        <section style="width:min(100%,390px);border:1px solid #35d8ff;border-radius:18px;padding:22px;background:rgba(7,12,18,.92);box-shadow:0 0 30px rgba(0,140,255,.25);">
          <h1 style="margin:0 0 8px;font-size:24px;">Loading RC Drift Sync</h1>
          <p style="margin:0;color:#aeb9c4;line-height:1.45;">If this stays on screen, refresh once to update the app on this phone.</p>
        </section>
      </main>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        if (!params.has("rcds_sw_reset") && !params.has("rcds_refresh")) return;

        if ("caches" in window) {
          caches.keys().then(function (keys) {
            return Promise.all(
              keys
                .filter(function (key) {
                  return key.indexOf("rc-drift-sync") === 0;
                })
                .map(function (key) {
                  return caches.delete(key);
                })
            );
          });
        }

        if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(
              registrations.map(function (registration) {
                return registration.unregister();
              })
            );
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
